[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-archiver"
version = "2.1.0"
description = "Enterprise-grade desktop photo archiving system for schools, government agencies, archives and photography studios."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rookievegetable" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"

# openpyxl ships no PEP 561 py.typed marker nor mypy stubs — ignore missing
# stubs so mypy src stays zero-error without types-openpyxl (which doesn't exist).
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true
