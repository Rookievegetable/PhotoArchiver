name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # 手动触发用于交付管线验证

jobs:
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

  # ADR-031 方案B（Phase P）：Windows 安装包构建——PyInstaller + Inno Setup。
  # 在线安装器（无模型）与离线安装器（含模型包）双产物。
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements/base.txt pyinstaller

      - name: Cache offline model pack
        uses: actions/cache@v4
        with:
          path: packaging/windows/models
          key: models-buffalo_l-${{ hashFiles('scripts/download_models.py') }}

      - name: Stage offline model pack (sha256 fail-closed)
        run: python scripts/download_models.py --root packaging/windows/models

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm --distpath build_dist packaging/windows/photo_archiver.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile online installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.ref_name }} packaging\windows\installer.iss'

      - name: Compile offline installer (models bundled)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.ref_name }} /DPACK_MODELS packaging\windows\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: packaging/windows/installer/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: installer/

      # CHANGELOG.md 由维护者手工维护（Keep a Changelog）；generate_release_notes
      # 追加自动生成的 contribuitors/commit 摘要，二者互补。
      - name: Create GitHub Release with built artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            installer/*
          generate_release_notes: true