name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # 手动触发用于交付管线验证

jobs:
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

  # ADR-031 方案B（Phase P）：Windows 安装包构建——PyInstaller + Inno Setup。
  # 在线安装器（无模型）与离线安装器（含模型包）双产物。
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        # pyinstaller 钉定本地验证版本——最新版可能在打包分析上有回归
        # （run #19 三平台本地模拟均绿、CI 独挂 Pytest 构建步骤的教训）。
        run: python -m pip install --upgrade pip && pip install -r requirements/base.txt pyinstaller==6.22.2

      - name: Cache offline model pack
        uses: actions/cache@v4
        with:
          path: packaging/windows/models
          key: models-buffalo_l-${{ hashFiles('scripts/download_models.py') }}

      - name: Stage offline model pack (sha256 fail-closed)
        run: python scripts/download_models.py --root packaging/windows/models

      - name: Write build stamp
        shell: bash
        run: |
          # 构建版本戳：frozen 应用启动日志/设置页显示真实交付版本，
          # 消除"跑的是哪个构建"的辨别困难。
          printf 'APP_BUILD = "%s
"' "${{ github.ref_name }}" > src/photo_archiver/_build_info.py

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          set +e
          pyinstaller --noconfirm --log-level INFO --distpath build_dist packaging/windows/photo_archiver.spec 2>&1 | tee pyinstaller-output.txt
          code=$?
          # 构建失败时把错误行转公开注解（匿名 API 可读，替代不可读的 job log）
          if [ "$code" -ne 0 ]; then
            grep -E "^ERROR|Traceback|error:" pyinstaller-output.txt | head -20 | while read -r line; do
              echo "::error::$line"
            done || true
            tail -n 30 pyinstaller-output.txt | cut -c1-200 | while read -r line; do
              echo "::error::build-tail|$line"
            done || true
          fi
          exit "$code"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Inno Setup dependencies
        run: choco install wget -y --no-progress && wget -q https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl -O "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: cmd

      - name: Compile online installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.ref_name }} packaging\windows\installer.iss > iscc-online.log 2>&1
          set EXITCODE=%ERRORLEVEL%
          if not "%EXITCODE%"=="0" goto iscc_failed
          exit /b 0
          :iscc_failed
          findstr /R /C:"^Error" /C:"Error on line" iscc-online.log > iscc-err.txt
          for /f "tokens=*" %%L in (iscc-err.txt) do echo ::error::iscc^|%%L
          exit %EXITCODE%

      - name: Compile offline installer (models bundled)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.ref_name }} /DPACK_MODELS packaging\windows\installer.iss > iscc-offline.log 2>&1
          set EXITCODE=%ERRORLEVEL%
          if not "%EXITCODE%"=="0" goto iscc_failed
          exit /b 0
          :iscc_failed
          findstr /R /C:"^Error" /C:"Error on line" iscc-offline.log > iscc-err.txt
          for /f "tokens=*" %%L in (iscc-err.txt) do echo ::error::iscc^|%%L
          exit %EXITCODE%

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: packaging/windows/installer/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: installer/

      # CHANGELOG.md 由维护者手工维护（Keep a Changelog）；generate_release_notes
      # 追加自动生成的 contribuitors/commit 摘要，二者互补。
      - name: Create GitHub Release with built artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            installer/*
          generate_release_notes: true