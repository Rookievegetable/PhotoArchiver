name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen   # pytest-qt 无头运行，三平台统一
      # LIMIT-006 D-1 补强：原生段错误时把 C 层栈（faulthandler）打进 stderr
      # 日志——本轮 .ips artifact 曾为空，faulthandler 是不依赖平台的兜底。
      PYTHONFAULTHANDLER: 1
      # LIMIT-006 实验五：扫描走 64MB 大栈 Python 线程——豁免 darwin skip 验证
      # 栈大小假设。绿 2 轮则确认根因并固化；仍崩则排除栈假设（剩子进程隔离）。
      PA_ALLOW_LIMIT_006: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      # 仅 Linux：PySide6 offscreen 运行所需系统库
      - name: Install Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements/dev.txt

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: resources/models
          key: models-buffalo_l-v1-${{ runner.os }}

      - name: Download AI models (idempotent, runs on cache miss)
        # P0-8 (Phase B): the buffalo_l digest is pinned in
        # scripts/download_models.py (EXPECTED_SHA256) — the script fails
        # closed on any mismatch, so no escape hatch is needed here anymore.
        # 3 attempts ride out transient release/CDN failures so the single
        # model source is not a hard CI single point of failure.
        shell: bash
        run: |
          for i in 1 2 3; do
            if python scripts/download_models.py; then
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s"
            sleep 10
          done
          echo "::error::model download failed after 3 attempts"
          exit 1

      # R-4 遗漏修复：缓存静默失败时 download_models 幂等返回 0 但模型未真就绪，
      # 8 条 AI 集成测试会 skipped 而非 failed——此断言强制模型目录非空存在。
      - name: Assert model pack present (R-4 guard against silent cache miss)
        shell: bash
        run: |
          if [ ! -d resources/models/buffalo_l ] || [ -z "$(ls -A resources/models/buffalo_l 2>/dev/null)" ]; then
            echo "::error::buffalo_l model pack missing after download step — ISSUE-008 closure criterion failed"
            exit 1
          fi
          echo "Model pack present: $(ls -A resources/models/buffalo_l | wc -l) files"

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy src

      # F-5（体检 T-5）：主 pytest 步骤落盘运行期输出供下方 no-skip 守卫解析。
      # 守卫不再用收集期 `pytest --co -q`（importorskip 的运行期 skip 不产生
      # 收集期 SKIPPED 行，守卫效力存疑）——改为 grep 运行期 `-rs` SKIPPED 行。
      - name: Pytest
        shell: bash
        run: |
          # 覆盖率门槛只在 Linux job 采集（F-5 风险缓解），基线 92-93%、
          # 门槛 90% 防下滑。注意：job shell 带 `-e -o pipefail`——pytest 的
          # 退出码必须先捕获，否则失败时脚本即刻退出，下方注解循环永远
          # 不会执行（run #76 实证过这个取证盲区）。
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            pytest -v --tb=short -rsf --cov=photo_archiver --cov-report=term --cov-fail-under=90 2>&1 | tee pytest-output.txt
          else
            pytest -v --tb=short -rsf 2>&1 | tee pytest-output.txt
          fi
          PYTEST_EXIT=$?
          grep -E "^FAILED|^ERROR" pytest-output.txt | while read -r line; do
            echo "::error::$line"
          done || true
          # 139/134 类原生崩溃没有 FAILED 汇总——把 faulthandler 段（含 C 层
          # 栈，从 "Fatal Python error" 到文件尾）逐行转注解，匿名 API 可读。
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            sed -n '/Fatal Python error/,$p' pytest-output.txt | cut -c1-200 | while read -r line; do
              echo "::error::fatal|$line"
            done || true
            if ! grep -q "Fatal Python error" pytest-output.txt; then
              tail -n 25 pytest-output.txt | cut -c1-200 | while read -r line; do
                echo "::error::tail|$line"
              done || true
            fi
          fi
          exit "$PYTEST_EXIT"

      # Phase F F-3（LIMIT-006 D-1）：macOS runner 原生段错误时自动收集 .ips
      # crash report 为 artifact——下次（若有）崩溃即可从原生栈定位落点
      # （libsystem_kernel / Qt GC / Python C-API），把"追查"从被动变主动。
      # 仅在 Pytest 步骤失败时执行；upload 对空目录宽容（if-no-files-found: ignore）。
      - name: Collect macOS crash reports
        if: runner.os == 'macOS' && failure()
        shell: bash
        run: |
          mkdir -p crash-reports
          cp -R "$HOME/Library/Logs/DiagnosticReports/" crash-reports/ 2>/dev/null || echo "no .ips crash reports found"
          ls -la crash-reports/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && failure()
        with:
          name: crash-reports-macos
          path: crash-reports/
          if-no-files-found: ignore

      # R-4 遗漏修复：ISSUE-008 关闭判据要求 8 条 AI 集成测试 passed 非 skipped。
      # 全量 pytest exit 0 不保证这一点（模型若中途失效 pytest 仍绿）——
      # 此步断言 tests/integration/face_detection/ 两文件无 skipped 行。
      - name: Assert AI integration tests ran not skipped (R-4 close ISSUE-008)
        shell: bash
        run: |
          SKIPPED=$(grep -cE "^SKIPPED.*tests[/\]integration[/\]face_detection[/\]" pytest-output.txt || true)
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::${SKIPPED} AI integration test(s) skipped at runtime — ISSUE-008 not truly closed (model pack failed during run)"
            exit 1
          fi
          echo "All AI integration tests ran without runtime skip — ISSUE-008 closure verified"

      # ISSUE-009 关闭判据：dev.txt 装齐后 presentation 测试必须真实运行。
      # importorskip 零默 skip 不使 pytest 变红——此步断言收集结果无 SKIPPED 行。
      # 与 R-4 AI 断言步同构（同 shell、同 pytest --co -q 采集、同 grep -c SKIPPED）。
      - name: Assert UI tests ran not skipped (close ISSUE-009)
        shell: bash
        run: |
          # 白名单：LIMIT-006 的 macOS darwin skipif（reason 带 LIMIT-006 标记）
          # 为长期存在项（原生层问题待上游/环境），不计入；ISSUE-009 失败模式
          # （PySide6 缺失整目录 skip）无该标记，仍会被捕获。
          SKIPPED=$(grep -E "^SKIPPED.*tests[/\]unit[/\]presentation[/\]" pytest-output.txt | grep -cv "LIMIT-006" || true)
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::${SKIPPED} UI test(s) skipped at runtime — ISSUE-009 not truly closed (PySide6/pytest-qt missing on runner)"
            exit 1
          fi
          echo "All UI tests ran without unsanctioned runtime skip — ISSUE-009 closure verified (LIMIT-006 darwin skips allowlisted)"

  # LIMIT-006 D-3（Phase G G-3）：非 qtbot 驱动的扫描压力实验 job——把
  # "真实 QThreadPool + 大目录"与"qtbot.waitUntil 主线程等待"两个变量拆开。
  # 仅 macOS（段错误观测平台）；跳过模型下载（扫描链不需要模型包）。
  stress-macos:
    name: macos stress (no qtbot)
    runs-on: macos-latest
    env:
      PA_STRESS: "1"
      PYTHONFAULTHANDLER: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements/dev.txt

      - name: Stress scan (direct + real QThreadPool, no qtbot)
        run: pytest -v tests/integration/test_scan_stress_no_qtbot.py

      # D-3 实验二：带 faulthandler 直跑真正的崩溃用例（豁免 darwin skip）。
      # 段错误若复现 → faulthandler/`.ips` 首次拿到 C 层栈；若通过 →
      # LIMIT-006 可降级。失败是数据不是事故——continue-on-error 保持绿树。
      - name: LIMIT-006 qtbot stress (evidence collection, may crash)
        continue-on-error: true
        run: |
          PA_ALLOW_LIMIT_006=1 pytest -v tests/unit/presentation/test_scan_single_flight.py::test_real_executor_refuses_second_scan_mid_flight_and_recovers tests/unit/presentation/test_scan_cancellation.py::test_real_cancelled_scan_reports_cancelled_terminal_and_recovers tests/integration/test_scan_cancel_consistency.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "EVIDENCE_OUTCOME=success" >> "$GITHUB_ENV"
          else
            echo "EVIDENCE_OUTCOME=failure" >> "$GITHUB_ENV"
          fi

      - name: LIMIT-006 streak tracker
        continue-on-error: true  # 遥测步骤：自身故障不得让 stress job 变红
        run: python scripts/limit006_streak.py

      - name: Collect macOS crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p crash-reports
          cp -R "$HOME/Library/Logs/DiagnosticReports/" crash-reports/ 2>/dev/null || echo "no .ips crash reports found"
          ls -la crash-reports/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports-macos-stress
          path: crash-reports/
          if-no-files-found: ignore
